{% load static %}
<link rel="stylesheet" href="{% static 'listings/css/style.css' %}">
<script src="{% static 'listings/js/script.js' %}"></script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Properties</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">RealEst</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/listings/">Listings</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="row mb-4">
    <div class="col">
        <form method="GET" class="row g-2">
            <div class="col-md-4">
                <input type="text" name="location" class="form-control" placeholder="Location" value="{{ request.GET.location }}">
            </div>
            <div class="col-md-3">
                <input type="number" name="min_price" class="form-control" placeholder="Min Price" value="{{ request.GET.min_price }}">
            </div>
            <div class="col-md-3">
                <input type="number" name="max_price" class="form-control" placeholder="Max Price" value="{{ request.GET.max_price }}">
            </div>
            <div class="col-md-2">
                <input type="number" name="bedrooms" class="form-control" placeholder="Bedrooms" value="{{ request.GET.bedrooms }}">
            </div>
            <div class="col-md-12 mt-2">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
        </form>
    </div>
</div>

<div class="container">
    <div class="row">
        {% for property in properties %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow">
                <img src="{{ property.image.url }}" class="card-img-top" alt="{{ property.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ property.title }}</h5>
                    <p class="card-text">{{ property.location }} | ${{ property.price }}</p>
                    <a href="{{ property.slug }}/" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
