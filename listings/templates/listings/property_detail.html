{% load static %}
<link rel="stylesheet" href="{% static 'listings/css/style.css' %}">
<script src="{% static 'listings/js/script.js' %}"></script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ property.title }} | RealEstateSite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card mb-4 shadow">
        <img src="{{ property.image.url }}" class="card-img-top" alt="{{ property.title }}">
        <div class="card-body">
            <h2 class="card-title">{{ property.title }}</h2>
            <p class="card-text"><strong>Location:</strong> {{ property.location }}</p>
            <p class="card-text"><strong>Price:</strong> ${{ property.price }}</p>
            <p class="card-text"><strong>Bedrooms:</strong> {{ property.bedrooms }}</p>
            <p class="card-text"><strong>Bathrooms:</strong> {{ property.bathrooms }}</p>
            <p class="card-text">{{ property.description }}</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
